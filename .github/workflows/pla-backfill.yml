name: PLA MND Backfill (one-off)

# 一次性回補 MND 共機擾台歷史資料
# 觸發：workflow_dispatch（手動 GitHub UI 點 Run）或推此檔本身
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pla-backfill.yml'

# 需要寫回 repo
permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system deps (tesseract + chi_tra)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-tra
          tesseract --version
          tesseract --list-langs | grep chi

      - name: Install npm deps
        run: npm ci

      - name: Run backfill
        run: node scripts/pla-backfill.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pla-incursions.json scripts/pla-anomalies.json scripts/pla-backfill-report.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: PLA MND backfill $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pla-backfill-output
          path: |
            src/data/pla-incursions.json
            scripts/pla-anomalies.json
            scripts/pla-backfill-report.txt
          retention-days: 30
