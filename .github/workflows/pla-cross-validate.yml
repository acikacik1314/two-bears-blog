name: PLA Cross-Validate (one-off, round 2)

# 對 pla-incursions.json 做中英交叉驗證重跑
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pla-cross-validate.yml'

permissions:
  contents: write

jobs:
  cross-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run cross-validate
        run: node scripts/pla-cross-validate.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pla-incursions.json scripts/pla-anomalies.json scripts/pla-cross-validate-report.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: PLA cross-validate re-run ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pla-cross-validate-output
          path: |
            src/data/pla-incursions.json
            scripts/pla-anomalies.json
            scripts/pla-cross-validate-report.txt
          retention-days: 30
