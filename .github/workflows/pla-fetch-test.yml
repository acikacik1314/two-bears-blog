name: PLA MND Fetch Test (one-off)

# 測試 GitHub Actions runner 能否連到 MND
# 用 workflow_dispatch 手動觸發，不排程

on:
  workflow_dispatch:

jobs:
  test-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Show runner IP + region
        run: |
          echo "=== Runner IP ==="
          curl -s https://api.ipify.org
          echo ""
          curl -s https://ipinfo.io/json || echo "ipinfo failed"

      - name: Fetch MND list page
        run: |
          echo "=== GET /news/plaactlist ==="
          curl -sk -o list.html -w "HTTP=%{http_code} size=%{size_download} time=%{time_total}s\n" \
            "https://www.mnd.gov.tw/news/plaactlist" \
            -H "User-Agent: Mozilla/5.0" \
            --max-time 30
          echo ""
          echo "=== File type ==="
          file list.html
          echo ""
          echo "=== First plaact link ==="
          grep -oE 'href="news/plaact/[0-9]+"' list.html | head -3 || echo "no article links found"

      - name: Fetch MND article page (specific ID)
        run: |
          echo "=== GET /news/plaact/87738 (recent article) ==="
          curl -sk -o article.html -w "HTTP=%{http_code} size=%{size_download} time=%{time_total}s\n" \
            "https://www.mnd.gov.tw/news/plaact/87738" \
            -H "User-Agent: Mozilla/5.0" \
            --max-time 30
          echo ""
          echo "=== Article content check (looking for 偵獲共機) ==="
          if grep -q '偵獲共機' article.html; then
            echo "✅ Article contains 偵獲共機 — text-parseable"
          else
            echo "❌ Article does NOT contain 偵獲共機"
          fi
          echo ""
          echo "=== title tag ==="
          grep -oE '<title>[^<]+</title>' article.html || echo "no title"

      - name: Fetch MND image file
        run: |
          echo "=== GET /File/59159 (image download) ==="
          curl -sk -o img.bin -w "HTTP=%{http_code} type=%{content_type} size=%{size_download}\n" \
            "https://www.mnd.gov.tw/File/59159" \
            -H "User-Agent: Mozilla/5.0" \
            --max-time 30
          echo ""
          file img.bin
