name: Podcast to Blog

on:
  schedule:
    - cron: '0 1 * * *'  # 09:00 台灣時間 (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync new podcast episodes (RSS → Groq Whisper → source .md)
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          PODCAST_SOURCE_DIR: /tmp/podcast-sources
          MAX_EPISODES: '5'
        run: |
          mkdir -p /tmp/podcast-sources
          node scripts/sync-podcast.mjs

      - name: Commit podcast tracking (避免下次重複處理)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/podcast-sync-tracking.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: 更新 podcast 追蹤記錄" && git push origin main || true

      - name: Check for new source files
        id: check
        run: |
          count=$(ls /tmp/podcast-sources/*.md 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "新來源檔數：$count"

      - name: Generate drafts (Gemini → blog post)
        if: steps.check.outputs.count != '0'
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          PODCAST_SOURCE_DIR: /tmp/podcast-sources
        run: node scripts/draft-posts.mjs

      - name: Check for new drafts
        id: check_drafts
        run: |
          count=$(ls drafts/*.md 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        if: steps.check_drafts.outputs.count != '0'
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: node scripts/publish-drafts.mjs
