name: Podcast to Blog

on:
  schedule:
    - cron: '0 */2 * * *'  # 每 2 小時執行一次（備援，Mac 離線時用）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 設定 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 抓 RSS、Gemini 產 frontmatter、直接寫草稿（含競態防護）
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          MAX_EPISODES: '3'
        run: node scripts/podcast-to-blog.mjs

      - name: 立刻 commit tracking（讓其他 runner 看到已認領的集數）
        run: |
          git add scripts/podcast-sync-tracking.json scripts/draft-tracking.json
          if git diff --cached --quiet; then
            echo "無新集數，tracking 無變更"
          else
            git commit -m "chore: 認領新集數（防競態）"
            git push origin main
          fi

      - name: 檢查是否有新草稿
        id: check_drafts
        run: |
          count=$(ls drafts/*.md 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "新草稿：$count"

      - name: Build 驗證 + 發布
        if: steps.check_drafts.outputs.count != '0'
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: node scripts/publish-drafts.mjs

      - name: 確認發布成功，寫入 podcast tracking
        if: steps.check_drafts.outputs.count != '0'
        run: node scripts/podcast-to-blog.mjs --finalize

      - name: Commit podcast-sync-tracking.json（最終 published 狀態）
        run: |
          git add scripts/podcast-sync-tracking.json scripts/draft-tracking.json
          if git diff --cached --quiet; then
            echo "tracking 無變更，跳過 commit"
          else
            git commit -m "chore: 更新 podcast 追蹤記錄"
            git push origin main
          fi
